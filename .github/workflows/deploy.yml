name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (OpenNext -> .open-next/worker.js + .open-next/assets)
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply paysdoc-auth-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy site Worker (paysdoc-nl)
        id: deploy_site
        run: |
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/site-deploy.log"
          # Wrangler lists what the Worker answers on (zone routes, or the
          # workers.dev URL when no routes are set) indented under the
          # "Deployed <name> triggers" line. A plain workers.dev grep would
          # instead pick up the EMAIL_WORKER_URL var echoed in the bindings.
          url="$(awk '/^Deployed .* triggers/{f=1; next} f && !/^  /{exit} f {sub(/^ +/, ""); printf "%s%s", (n++ ? ", " : ""), $0}' "$RUNNER_TEMP/site-deploy.log" || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push site Worker secrets
        # Values are only ever passed via env and piped on stdin; never echoed.
        run: |
          jq -n '{
            AUTH_SECRET: env.AUTH_SECRET,
            AUTH_GOOGLE_ID: env.AUTH_GOOGLE_ID,
            AUTH_GOOGLE_SECRET: env.AUTH_GOOGLE_SECRET,
            AUTH_GITHUB_ID: env.AUTH_GITHUB_ID,
            AUTH_GITHUB_SECRET: env.AUTH_GITHUB_SECRET,
            COST_API_TOKEN: env.COST_API_TOKEN
          }' | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          COST_API_TOKEN: ${{ secrets.COST_API_TOKEN }}

      - name: Install email worker dependencies
        working-directory: workers/email-worker
        run: npm ci

      - name: Deploy email Worker
        working-directory: workers/email-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push email Worker secrets
        working-directory: workers/email-worker
        run: |
          jq -n '{
            AUTH_SECRET: env.AUTH_SECRET,
            RESEND_API_KEY: env.RESEND_API_KEY
          }' | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Deployed Worker URL
        run: |
          url='${{ steps.deploy_site.outputs.url }}'
          echo "=================================================="
          echo " paysdoc-nl Worker triggers: ${url:-<not found in wrangler output>}"
          echo "=================================================="
          echo "### Deployed Worker triggers (routes or workers.dev URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${url:-_not found in wrangler output_}" >> "$GITHUB_STEP_SUMMARY"
